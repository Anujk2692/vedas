server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/all_service_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:allservice}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:allservice}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

vedas:
  cors:
    allowed-origins: ${VEDAS_CORS_ALLOWED_ORIGINS:*}
  media:
    base-url: ${VEDAS_MEDIA_BASE_URL:http://localhost:8080/api/media}
  seed:
    force: false
  migrate-mongo: ${MIGRATE_MONGO:false}
  legacy-mongo:
    uri: ${SPRING_DATA_MONGODB_URI:}
    database: ${SPRING_DATA_MONGODB_DATABASE:all_service_db}
  ai:
    enabled: ${VEDAS_AI_ENABLED:false}
    openai-api-key: ${VEDAS_OPENAI_API_KEY:}
    model: ${VEDAS_AI_MODEL:gpt-4o-mini}
  subscription:
    dev-testing-enabled: ${VEDAS_SUBSCRIPTION_DEV_TESTING_ENABLED:true}
    webhook-secret: ${VEDAS_SUBSCRIPTION_WEBHOOK_SECRET:}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
