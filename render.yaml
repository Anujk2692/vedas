# Render Blueprint — connect repo at:
# https://dashboard.render.com/project/prj-d952s0m7r5hc73duups0
#
# Uses Render's managed PostgreSQL database `sanatan-db` (DB name `sanatan_db`, user `sanatan`).

databases:
  - name: sanatan-db
    databaseName: sanatan_db
    user: sanatan
    plan: free
    region: oregon

services:
  - type: web
    name: vedas-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: sanatan-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: sanatan-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: sanatan-db
          property: password
      - key: MIGRATE_MONGO
        value: "false"
      - key: VEDAS_MEDIA_BASE_URL
        value: https://vedas-oax2.onrender.com/api/media
      - key: VEDAS_CORS_ALLOWED_ORIGINS
        value: "*"
