# Render Blueprint — connect repo at:
# https://dashboard.render.com/project/prj-d952s0m7r5hc73duups0
#
# Uses Render's managed PostgreSQL database `all-service-db` (DB name `all_service_db`, user `allservice`).

databases:
  - name: all-service-db
    databaseName: all_service_db
    user: allservice
    plan: free
    region: singapore

services:
  - type: web
    name: vedas-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: all-service-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: all-service-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: all-service-db
          property: password
      - key: MIGRATE_MONGO
        value: "false"
      - key: VEDAS_MEDIA_BASE_URL
        value: https://vedas-oax2.onrender.com/api/media
      - key: VEDAS_CORS_ALLOWED_ORIGINS
        value: "*"
