name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test backend
        working-directory: vedas-backend
        run: mvn -B test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vedas-web/package-lock.json
      - name: Install and build web
        working-directory: vedas-web
        env:
          NG_CLI_ANALYTICS: 'false'
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: VedasApp/package-lock.json
      - name: Typecheck, lint, and test mobile
        working-directory: VedasApp
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint -- --quiet
          npx jest --watchAll=false --watchman=false
